<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#ffffff"/>
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #172033; }
    .heading { font: 700 25px Arial, sans-serif; fill: #172033; }
    .sub { font: 19px Arial, sans-serif; fill: #4b5563; }
    .nodeText { font: 700 20px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .edge { stroke: #aab3c2; stroke-width: 2; opacity: 0.72; }
    .weightBox { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; rx: 12; }
    .biasBox { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 12; }
    .boxTitle { font: 700 19px Arial, sans-serif; fill: #172033; text-anchor: middle; }
    .boxSub { font: 16px Arial, sans-serif; fill: #4b5563; text-anchor: middle; }
    .biasLine { stroke: #f97316; stroke-width: 2; stroke-dasharray: 7 6; opacity: 0.8; }
    .input { fill: #2563eb; stroke: #1e40af; stroke-width: 3; }
    .hidden { fill: #16a34a; stroke: #166534; stroke-width: 3; }
    .output { fill: #ea580c; stroke: #9a3412; stroke-width: 3; }
    .note { font: 20px Arial, sans-serif; fill: #273449; }
  </style>

  <text x="600" y="55" class="title" text-anchor="middle">Perceptron multicouche 3–4–2</text>

  <text x="190" y="120" class="heading" text-anchor="middle">Couche d’entrée</text>
  <text x="190" y="150" class="sub" text-anchor="middle">3 neurones</text>
  <text x="600" y="120" class="heading" text-anchor="middle">Couche cachée</text>
  <text x="600" y="150" class="sub" text-anchor="middle">4 neurones · ReLU</text>
  <text x="1010" y="120" class="heading" text-anchor="middle">Couche de sortie</text>
  <text x="1010" y="150" class="sub" text-anchor="middle">2 neurones</text>

  <!-- Weight labels -->
  <rect x="315" y="170" width="170" height="62" class="weightBox"/>
  <text x="400" y="196" class="boxTitle">W₁ : 3 × 4</text>
  <text x="400" y="219" class="boxSub">12 poids sur ces liens</text>
  <rect x="725" y="170" width="170" height="62" class="weightBox"/>
  <text x="810" y="196" class="boxTitle">W₂ : 4 × 2</text>
  <text x="810" y="219" class="boxSub">8 poids sur ces liens</text>

  <!-- Fully connected edges: input to hidden -->
  <g>
    <line x1="240" y1="255" x2="550" y2="210" class="edge"/><line x1="240" y1="255" x2="550" y2="330" class="edge"/><line x1="240" y1="255" x2="550" y2="450" class="edge"/><line x1="240" y1="255" x2="550" y2="570" class="edge"/>
    <line x1="240" y1="390" x2="550" y2="210" class="edge"/><line x1="240" y1="390" x2="550" y2="330" class="edge"/><line x1="240" y1="390" x2="550" y2="450" class="edge"/><line x1="240" y1="390" x2="550" y2="570" class="edge"/>
    <line x1="240" y1="525" x2="550" y2="210" class="edge"/><line x1="240" y1="525" x2="550" y2="330" class="edge"/><line x1="240" y1="525" x2="550" y2="450" class="edge"/><line x1="240" y1="525" x2="550" y2="570" class="edge"/>
  </g>

  <!-- Fully connected edges: hidden to output -->
  <g>
    <line x1="650" y1="210" x2="960" y2="315" class="edge"/><line x1="650" y1="210" x2="960" y2="465" class="edge"/>
    <line x1="650" y1="330" x2="960" y2="315" class="edge"/><line x1="650" y1="330" x2="960" y2="465" class="edge"/>
    <line x1="650" y1="450" x2="960" y2="315" class="edge"/><line x1="650" y1="450" x2="960" y2="465" class="edge"/>
    <line x1="650" y1="570" x2="960" y2="315" class="edge"/><line x1="650" y1="570" x2="960" y2="465" class="edge"/>
  </g>

  <!-- Nodes -->
  <g><circle cx="190" cy="255" r="50" class="input"/><text x="190" y="255" class="nodeText">x₁</text></g>
  <g><circle cx="190" cy="390" r="50" class="input"/><text x="190" y="390" class="nodeText">x₂</text></g>
  <g><circle cx="190" cy="525" r="50" class="input"/><text x="190" y="525" class="nodeText">x₃</text></g>

  <g><circle cx="600" cy="210" r="50" class="hidden"/><text x="600" y="210" class="nodeText">h₁</text></g>
  <g><circle cx="600" cy="330" r="50" class="hidden"/><text x="600" y="330" class="nodeText">h₂</text></g>
  <g><circle cx="600" cy="450" r="50" class="hidden"/><text x="600" y="450" class="nodeText">h₃</text></g>
  <g><circle cx="600" cy="570" r="50" class="hidden"/><text x="600" y="570" class="nodeText">h₄</text></g>

  <g><circle cx="1010" cy="315" r="50" class="output"/><text x="1010" y="315" class="nodeText">y₁</text></g>
  <g><circle cx="1010" cy="465" r="50" class="output"/><text x="1010" y="465" class="nodeText">y₂</text></g>

  <!-- Biases are added after the weighted sums -->
  <rect x="500" y="625" width="200" height="62" class="biasBox"/>
  <text x="600" y="651" class="boxTitle">b₁ : 4 biais</text>
  <text x="600" y="674" class="boxSub">un par neurone caché</text>
  <line x1="600" y1="625" x2="600" y2="620" class="biasLine"/>

  <rect x="910" y="555" width="200" height="62" class="biasBox"/>
  <text x="1010" y="581" class="boxTitle">b₂ : 2 biais</text>
  <text x="1010" y="604" class="boxSub">un par neurone de sortie</text>
  <line x1="1010" y1="555" x2="1010" y2="515" class="biasLine"/>

  <text x="600" y="725" class="note" text-anchor="middle">20 poids + 6 biais = 26 paramètres au total</text>
</svg>
